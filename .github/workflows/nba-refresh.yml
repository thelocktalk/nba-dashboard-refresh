# Public launcher. The private NBA code and state are never committed here.
name: NBA source refresh
on:
  schedule:
    - cron: '2 * * * *'
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      maintenance:
        description: Update the public scheduler activity record only
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/nba-refresh.yml]
permissions:
  contents: read
  id-token: write
env:
  NBA_RUNTIME_SHA256: 0ca6c67becd06d5ed7f231d5eaa02038756a8f50cc646c96780dd2e736f934ac
jobs:
  refresh:
    if: github.event.schedule != '23 4 1 * *' && inputs.maintenance != true
    concurrency:
      group: nba-source-refresh
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 126
    steps:
      - name: Run the owner-approved private source refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, sys, tarfile, time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          endpoint='https://codex-nbatlt.vercel.app/api/nba-cloud'
          auth_url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&'+urlencode({'audience':endpoint})
          def read_manifest():
              with urlopen(Request(auth_url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}),timeout=30) as response:
                  token=json.load(response)['value']
              headers={'Authorization':'Bearer '+token,'Cache-Control':'no-cache'}
              with urlopen(Request(endpoint+'?operation=snapshot',headers=headers),timeout=60) as response:
                  return json.load(response),headers
          manifest,headers=read_manifest()
          item=manifest['runtime']
          if item['sha256']!=os.environ['NBA_RUNTIME_SHA256']:raise ValueError('The runtime requires owner approval.')
          with urlopen(Request(endpoint+'?operation=object&sha256='+item['sha256'],headers=headers),timeout=60) as response:
              raw=response.read()
          if len(raw)!=item['size'] or hashlib.sha256(raw).hexdigest()!=item['sha256']:raise ValueError('Runtime integrity failed.')
          target=pathlib.Path('private-runtime').resolve()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
              members=archive.getmembers()
              if sum(member.size for member in members)>500000000:raise ValueError('Runtime exceeds its expansion bound.')
              if any(not member.isfile() or not (target/member.name).resolve().is_relative_to(target) for member in members):raise ValueError('Unsafe runtime.')
              archive.extractall(target,members=members,filter='data')
          root=target/'BettingSystem'
          subprocess.run([sys.executable,'-m','pip','install','--quiet','--disable-pip-version-check','-r',str(root/'requirements-nba-cloud-fast.txt')],check=True)
          deadline=time.monotonic()+7190
          attempt=os.environ['GITHUB_RUN_ATTEMPT']
          for tick in range(25):
              latest,_=read_manifest()
              if latest['runtime']['sha256']!=item['sha256']:
                  print('A new owner-approved runtime is ready; this worker is stopping for its successor.',flush=True)
                  break
              environment={**os.environ,'GITHUB_RUN_ATTEMPT':attempt+'_t'+str(tick).zfill(2)}
              result=subprocess.run([sys.executable,str(root/'tools/run_nba_cloud.py'),'--mode','refresh'],env=environment,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=300)
              if result.returncode:raise RuntimeError('Source refresh did not complete. The last verified dashboard remains live.')
              print('Source refresh tick '+str(tick)+' completed; original source timestamps and release gates remain controlling.',flush=True)
              delay=(int(time.time()//300)+1)*300+2-time.time()
              if time.monotonic()+delay>deadline:break
              time.sleep(max(0,delay))
          PY
  maintain-schedule:
    if: github.event.schedule == '23 4 1 * *' || inputs.maintenance == true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Retain a monthly public scheduler activity record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          url='https://api.github.com/repos/thelocktalk/nba-dashboard-refresh/contents/scheduler-activity.txt'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          content='Scheduler maintenance: '+datetime.datetime.now(datetime.timezone.utc).isoformat()+'\n'
          payload={'message':'Maintain the active public scheduler','branch':'main','content':base64.b64encode(content.encode()).decode()}
          try:
              with urlopen(Request(url,headers=headers),timeout=30) as response:payload['sha']=json.load(response)['sha']
          except HTTPError as error:
              if error.code!=404:raise
          with urlopen(Request(url,data=json.dumps(payload).encode(),headers=headers,method='PUT'),timeout=30) as response:
              if response.status not in (200,201):raise RuntimeError('Scheduler maintenance failed.')
          print('The public scheduler activity record is current. No private runtime or data was accessed.')
          PY
